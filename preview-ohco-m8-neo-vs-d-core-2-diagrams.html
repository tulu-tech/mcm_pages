<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Diagrams — OHCO M8 NEO vs D.Core 2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; font-family: Inter, system-ui, sans-serif; color: #e8e0d4; }
    .header { text-align: center; padding: 40px 20px 20px; }
    .header h1 { font-size: 28px; color: #d4a955; letter-spacing: 2px; }
    .header p { font-size: 14px; opacity: .6; margin-top: 8px; }
    .diagram-section { max-width: 1600px; margin: 30px auto; padding: 0 20px; }
    .diagram-section h2 { font-size: 18px; color: #d4a955; margin-bottom: 12px; letter-spacing: 1px; }
    .diagram-section img {
      width: 100%; height: auto;
      border-radius: 16px;
      border: 1px solid rgba(212,169,85,.2);
      box-shadow: 0 8px 40px rgba(0,0,0,.4);
    }
    .diagram-section + .diagram-section { margin-top: 50px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>SVG DIAGRAMS — OHCO M8 NEO vs D.Core 2</h1>
    <p>6 pixel-perfect comparison diagrams generated from calibrated coordinates</p>
  </div>

  <div class="diagram-section">
    <h2>1 · Feature Zone Map</h2>
    <img src="assets/ohco-dcore-feature-map.svg" alt="Feature Zone Map">
  </div>

  <div class="diagram-section">
    <h2>2 · Massage Engine Diagram</h2>
    <img src="assets/ohco-dcore-mechanism-diagram.svg" alt="Massage Engine Diagram">
  </div>

  <div class="diagram-section">
    <h2>3 · Body Scan Diagram</h2>
    <img src="assets/ohco-dcore-body-scan-diagram.svg" alt="Body Scan Diagram">
  </div>

  <div class="diagram-section">
    <h2>4 · Lower Body Diagram</h2>
    <img src="assets/ohco-dcore-lower-body-diagram.svg" alt="Lower Body Diagram">
  </div>

  <div class="diagram-section">
    <h2>5 · Heat &amp; Programs</h2>
    <img src="assets/ohco-dcore-heat-programs-diagram.svg" alt="Heat &amp; Programs">
  </div>

  <div class="diagram-section">
    <h2>6 · Fit &amp; Warranty</h2>
    <img src="assets/ohco-dcore-fit-warranty-diagram.svg" alt="Fit &amp; Warranty">
  </div>
</body>
</html>

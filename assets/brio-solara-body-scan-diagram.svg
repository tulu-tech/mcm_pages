<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-label="Body Scan Diagram — Brio+ vs Solara">
  <defs>
    <linearGradient id="bg3" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f7f9f9"/><stop offset="1" stop-color="#e8ede6"/></linearGradient>
    <filter id="sh3" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1a2e30" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="980" fill="url(#bg3)"/>
  <text x="800" y="56" fill="#3f5f64" font-family="Inter,sans-serif" font-size="13" font-weight="900" letter-spacing="4" text-anchor="middle">MASSAGE CHAIRS &amp; MORE — BODY SCAN TECHNOLOGY</text>
  <text x="800" y="100" fill="#0b0b0b" font-family="Georgia,serif" font-size="40" font-weight="800" text-anchor="middle">Body Scan &amp; Personalization</text>
  <text x="800" y="132" fill="#67605a" font-family="Inter,sans-serif" font-size="16" text-anchor="middle">How each chair finds your body and customizes the session to fit you</text>

  <!-- ========== BRIO+ Card ========== -->
  <rect x="60" y="165" width="720" height="560" rx="24" fill="#fff" filter="url(#sh3)"/>
  <rect x="80" y="185" width="280" height="38" rx="19" fill="#3f5f64"/>
  <text x="220" y="210" fill="#fff" font-family="Inter,sans-serif" font-size="14" font-weight="900" letter-spacing="2" text-anchor="middle">BRIO+ · AUTO BODY SCAN</text>
  <image href="https://cdn.shopify.com/s/files/1/0813/4036/7096/files/Artboard-1-100-14-1.jpg?v=1772325831" x="180" y="210" width="480" height="480" preserveAspectRatio="xMidYMid meet"/>

  <!-- Scan zone - Head to Neck -->
  <circle cx="374" cy="369" r="16" fill="none" stroke="#3f5f64" stroke-width="3" stroke-dasharray="6 3" opacity=".8"/>
  <circle cx="386" cy="392" r="12" fill="none" stroke="#3f5f64" stroke-width="2" stroke-dasharray="6 3" opacity=".5"/>
  <!-- Scan beam visualization -->
  <line x1="340" y1="345" x2="440" y2="345" stroke="#3f5f64" stroke-width="1.5" opacity=".3"/>
  <line x1="330" y1="370" x2="450" y2="370" stroke="#3f5f64" stroke-width="1.5" opacity=".4"/>
  <line x1="335" y1="395" x2="460" y2="395" stroke="#3f5f64" stroke-width="1.5" opacity=".3"/>

  <line x1="360" y1="350" x2="140" y2="290" stroke="#3f5f64" stroke-width="1.5"/>
  <rect x="80" y="276" width="180" height="52" rx="8" fill="#3f5f64" opacity=".08"/>
  <text x="170" y="295" fill="#3f5f64" font-family="Inter,sans-serif" font-size="11" font-weight="800" text-anchor="middle">AUTO SHOULDER SCAN</text>
  <text x="170" y="315" fill="#3f5f64" font-family="Inter,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Detects shoulder position</text>

  <!-- Back area scan -->
  <rect x="380" y="395" width="44" height="50" rx="10" fill="none" stroke="#3f5f64" stroke-width="2" stroke-dasharray="5 3" opacity=".4"/>
  <line x1="424" y1="420" x2="570" y2="400" stroke="#3f5f64" stroke-width="1.5"/>
  <rect x="570" y="387" width="170" height="52" rx="8" fill="#3f5f64" opacity=".08"/>
  <text x="655" y="406" fill="#3f5f64" font-family="Inter,sans-serif" font-size="11" font-weight="800" text-anchor="middle">BODY TYPE ADAPT</text>
  <text x="655" y="426" fill="#3f5f64" font-family="Inter,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Tailors feel to your body</text>

  <!-- Height range -->
  <rect x="80" y="530" width="160" height="52" rx="8" fill="#3f5f64" opacity=".08"/>
  <text x="160" y="549" fill="#3f5f64" font-family="Inter,sans-serif" font-size="11" font-weight="800" text-anchor="middle">HEIGHT RANGE</text>
  <text x="160" y="569" fill="#3f5f64" font-family="Inter,sans-serif" font-size="14" font-weight="700" text-anchor="middle">5'0" – 6'5"</text>

  <rect x="80" y="695" width="680" height="18" rx="4" fill="#3f5f64" opacity=".06"/>
  <text x="420" y="708" fill="#3f5f64" font-family="Inter,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Automatic scan at every session start · No manual adjustment needed</text>

  <!-- ========== SOLARA Card ========== -->
  <rect x="820" y="165" width="720" height="560" rx="24" fill="#fff" filter="url(#sh3)"/>
  <rect x="840" y="185" width="290" height="38" rx="19" fill="#a66f3d"/>
  <text x="985" y="210" fill="#fff" font-family="Inter,sans-serif" font-size="14" font-weight="900" letter-spacing="2" text-anchor="middle">SOLARA · TRACK FITTING</text>
  <image href="https://cdn.shopify.com/s/files/1/0813/4036/7096/files/1.jpg?v=1772326021" x="940" y="210" width="480" height="480" preserveAspectRatio="xMidYMid meet"/>

  <!-- SL-Track fitting -->
  <path d="M1128,367 Q1140,389 1151,412 Q1165,427 1178,441" fill="none" stroke="#a66f3d" stroke-width="3" stroke-dasharray="6 3" opacity=".6"/>
  <circle cx="1128" cy="367" r="14" fill="none" stroke="#a66f3d" stroke-width="2.5" stroke-dasharray="5 3" opacity=".7"/>

  <line x1="1114" y1="360" x2="900" y2="290" stroke="#a66f3d" stroke-width="1.5"/>
  <rect x="840" y="276" width="180" height="52" rx="8" fill="#a66f3d" opacity=".08"/>
  <text x="930" y="295" fill="#a66f3d" font-family="Inter,sans-serif" font-size="11" font-weight="800" text-anchor="middle">SL-TRACK FOLLOWS</text>
  <text x="930" y="315" fill="#a66f3d" font-family="Inter,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Body line contour</text>

  <line x1="1177" y1="435" x2="1330" y2="405" stroke="#a66f3d" stroke-width="1.5"/>
  <rect x="1330" y="392" width="170" height="52" rx="8" fill="#a66f3d" opacity=".08"/>
  <text x="1415" y="411" fill="#a66f3d" font-family="Inter,sans-serif" font-size="11" font-weight="800" text-anchor="middle">CONTINUOUS GLIDE</text>
  <text x="1415" y="431" fill="#a66f3d" font-family="Inter,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Stays on target as you recline</text>

  <!-- Removable seat pad note -->
  <rect x="840" y="530" width="185" height="52" rx="8" fill="#a66f3d" opacity=".08"/>
  <text x="933" y="549" fill="#a66f3d" font-family="Inter,sans-serif" font-size="11" font-weight="800" text-anchor="middle">REMOVABLE SEAT PAD</text>
  <text x="933" y="569" fill="#a66f3d" font-family="Inter,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Adjust intensity feel</text>

  <rect x="840" y="695" width="680" height="18" rx="4" fill="#a66f3d" opacity=".06"/>
  <text x="1180" y="708" fill="#a66f3d" font-family="Inter,sans-serif" font-size="12" font-weight="700" text-anchor="middle">SL-Track contouring · Smooth coverage · No-assembly, plug-and-play</text>

  <!-- VS Badge -->
  <circle cx="800" cy="445" r="32" fill="#0b0b0b"/>
  <text x="800" y="453" fill="#fff" font-family="Georgia,serif" font-size="22" font-weight="700" text-anchor="middle">VS</text>

  <!-- Bottom CTA -->
  <rect x="520" y="780" width="560" height="56" rx="28" fill="#3f5f64"/>
  <text x="800" y="814" fill="#fff" font-family="Inter,sans-serif" font-size="16" font-weight="800" letter-spacing="1" text-anchor="middle">TEST THE FIT IN OUR SHOWROOM →</text>
  <text x="800" y="870" fill="#888" font-family="Inter,sans-serif" font-size="13" text-anchor="middle">massagechairsandmore.com · Pleasanton · Santa Clara · Daly City · Sacramento</text>
</svg>

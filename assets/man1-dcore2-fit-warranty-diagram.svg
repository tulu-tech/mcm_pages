<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 1600 980" role="img" aria-label="Fit &amp; Warranty Diagram — Panasonic MAN1 vs D.Core 2">
  <defs>
    <linearGradient id="bg6" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fbfaf7"/><stop offset="1" stop-color="#eee6da"/></linearGradient>
    <filter id="sh6" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2b2114" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="980" fill="url(#bg6)"/>
  
  <text x="800" y="56" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="13" font-weight="900" letter-spacing="4" text-anchor="middle">MASSAGE CHAIRS &amp; MORE — FIT &amp; OWNERSHIP</text>
  <text x="800" y="100" fill="#0b0b0b" font-family="Georgia,serif" font-size="40" font-weight="800" text-anchor="middle">Body fit, design, and ownership</text>
  <text x="800" y="132" fill="#67605a" font-family="Inter,sans-serif" font-size="16" text-anchor="middle">Physical dimensions, user height range, design style, and service confidence</text>

  <!-- MAN1 Card -->
  <rect x="60" y="165" width="720" height="560" rx="24" fill="#fff" filter="url(#sh6)"/>  <image href="https://massagechairsandmore.com/cdn/shop/files/Artboard-1.png?v=1772489014&amp;width=1200" x="180" y="210" width="480" height="480" preserveAspectRatio="xMidYMid meet"/>

  <rect x="80" y="185" width="210" height="38" rx="19" fill="#9a7f4a"/>
  <text x="185" y="210" fill="#fff" font-family="Inter,sans-serif" font-size="14" font-weight="900" letter-spacing="2" text-anchor="middle">PANASONIC MAN1</text>

  <!-- MAN1 Bounding box (chair edges) -->
  <rect x="298" y="334" rx="14" width="210" height="235" fill="none" stroke="#9a7f4a" stroke-width="2" stroke-dasharray="8 5" opacity=".35"/>

  <!-- MAN1 Height measurement line -->
  <line x1="280" y1="334" x2="280" y2="569" stroke="#9a7f4a" stroke-width="1.5" stroke-dasharray="4 3" opacity=".6"/>
  <line x1="272" y1="334" x2="288" y2="334" stroke="#9a7f4a" stroke-width="1.5" opacity=".6"/>
  <line x1="272" y1="569" x2="288" y2="569" stroke="#9a7f4a" stroke-width="1.5" opacity=".6"/>

  <!-- MAN1 Height label -->
  <rect x="80" y="430" width="180" height="78" rx="10" fill="#9a7f4a" opacity=".08"/>
  <text x="95" y="452" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="12" font-weight="800">HEIGHT RANGE</text>
  <text x="95" y="472" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="11" font-weight="600">4'8" — 6'2"</text>
  <text x="95" y="492" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="11" font-weight="600">Max weight: 264 lb</text>
  <line x1="260" y1="460" x2="280" y2="450" stroke="#9a7f4a" stroke-width="1.5"/>

  <!-- MAN1 Key highlights -->
  <rect x="545" y="420" width="220" height="110" rx="10" fill="#9a7f4a" opacity=".08"/>
  
  <text x="560" y="462" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">✦ Technology-forward design</text>
  <text x="560" y="480" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">✦ Designed in Osaka, Japan</text>
  <text x="560" y="498" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">✦ Strong Panasonic service</text>
  <text x="560" y="516" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">✦ $15,299 → $12,999</text>

  
  

  <!-- D.Core 2 Card -->
  <rect x="820" y="165" width="720" height="560" rx="24" fill="#fff" filter="url(#sh6)"/>  <image href="https://massagechairsandmore.com/cdn/shop/files/asd2.jpg?v=1772565432&amp;width=1200" x="940" y="210" width="480" height="480" preserveAspectRatio="xMidYMid meet"/>

  <rect x="840" y="185" width="160" height="38" rx="19" fill="#617064"/>
  <text x="920" y="210" fill="#fff" font-family="Inter,sans-serif" font-size="14" font-weight="900" letter-spacing="2" text-anchor="middle">D.CORE 2</text>

  <!-- D.Core 2 Bounding box -->
  <rect x="1062" y="324" rx="14" width="227" height="266" fill="none" stroke="#617064" stroke-width="2" stroke-dasharray="8 5" opacity=".35"/>

  <!-- D.Core 2 Height measurement line -->
  <line x1="1044" y1="324" x2="1044" y2="590" stroke="#617064" stroke-width="1.5" stroke-dasharray="4 3" opacity=".6"/>
  <line x1="1036" y1="324" x2="1052" y2="324" stroke="#617064" stroke-width="1.5" opacity=".6"/>
  <line x1="1036" y1="590" x2="1052" y2="590" stroke="#617064" stroke-width="1.5" opacity=".6"/>

  <!-- D.Core 2 Height label -->
  <rect x="840" y="430" width="185" height="78" rx="10" fill="#617064" opacity=".08"/>
  <text x="855" y="452" fill="#617064" font-family="Inter,sans-serif" font-size="12" font-weight="800">HEIGHT RANGE</text>
  <text x="855" y="472" fill="#617064" font-family="Inter,sans-serif" font-size="11" font-weight="600">Confirm in showroom</text>
  <text x="855" y="492" fill="#617064" font-family="Inter,sans-serif" font-size="11" font-weight="600">Verify dimensions + fit</text>
  <line x1="1025" y1="460" x2="1044" y2="450" stroke="#617064" stroke-width="1.5"/>

  <!-- D.Core 2 Key highlights -->
  <rect x="1310" y="420" width="210" height="110" rx="10" fill="#617064" opacity=".08"/>
  
  <text x="1325" y="462" fill="#617064" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">✦ Furniture-first luxury</text>
  <text x="1325" y="480" fill="#617064" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">✦ Handcrafted in Japan</text>
  <text x="1325" y="498" fill="#617064" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">✦ Oak panels + handrails</text>
  <text x="1325" y="516" fill="#617064" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">✦ $16,999 → $14,999</text>

  
  

  <!-- VS badge -->
  <circle cx="800" cy="450" r="32" fill="#1a1814"/>
  <text x="800" y="456" fill="#e7c77d" font-family="Inter,sans-serif" font-size="16" font-weight="900" text-anchor="middle">VS</text>

  <text x="800" y="940" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">MASSAGECHAIRSANDMORE.COM</text>
</svg>

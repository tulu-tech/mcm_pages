<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-label="Massage Engine Diagram — Panasonic MAN1 vs D.Core 2">
  <defs>
    <linearGradient id="bg2" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fbfaf7"/><stop offset="1" stop-color="#eee6da"/></linearGradient>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2b2114" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="980" fill="url(#bg2)"/>
  <text x="800" y="56" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="13" font-weight="900" letter-spacing="4" text-anchor="middle">MASSAGE CHAIRS &amp; MORE — MASSAGE ENGINE</text>
  <text x="800" y="100" fill="#0b0b0b" font-family="Georgia,serif" font-size="40" font-weight="800" text-anchor="middle">Precision engineering vs True Shiatsu</text>
  <text x="800" y="132" fill="#67605a" font-family="Inter,sans-serif" font-size="16" text-anchor="middle">Roller mechanism, back coverage, and massage personality compared</text>

  <!-- MAN1 Card -->
  <rect x="60" y="165" width="720" height="560" rx="24" fill="#fff" filter="url(#sh2)"/>
  <rect x="80" y="185" width="210" height="38" rx="19" fill="#9a7f4a"/>
  <text x="185" y="210" fill="#fff" font-family="Inter,sans-serif" font-size="14" font-weight="900" letter-spacing="2" text-anchor="middle">PANASONIC MAN1</text>
  <image href="https://massagechairsandmore.com/cdn/shop/files/Artboard-1.png?v=1772489014&amp;width=1200" x="180" y="210" width="480" height="480" preserveAspectRatio="xMidYMid meet"/>

  <!-- MAN1 back engine ellipse -->
  <ellipse cx="379" cy="398" rx="45" ry="70" fill="none" stroke="#9a7f4a" stroke-width="2" stroke-dasharray="6 4" opacity=".6"/>
  <circle cx="356" cy="353" r="8" fill="#9a7f4a" opacity=".5"/>
  <circle cx="379" cy="398" r="8" fill="#9a7f4a" opacity=".5"/>
  <circle cx="431" cy="451" r="8" fill="#9a7f4a" opacity=".5"/>
  <!-- SL-Track path -->
  <path d="M356,353 C365,370 375,390 379,398 C385,415 400,435 431,451" fill="none" stroke="#9a7f4a" stroke-width="2" stroke-dasharray="8 4" opacity=".45"/>

  <line x1="424" y1="398" x2="545" y2="380" stroke="#9a7f4a" stroke-width="1.5"/>
  <rect x="545" y="360" width="215" height="68" rx="10" fill="#9a7f4a" opacity=".08"/>
  <text x="560" y="382" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="12" font-weight="800">Real Pro Ultra H.I.</text>
  <text x="560" y="400" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">Pressure-sensing SL-Track rollers</text>
  <text x="560" y="416" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">Force feedback + 1260P scan</text>

  <rect x="80" y="695" width="680" height="18" rx="4" fill="#9a7f4a" opacity=".06"/>
  <text x="420" y="708" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Technical · Targeted · Adaptive · Precision-engineered</text>

  <!-- D.Core 2 Card -->
  <rect x="820" y="165" width="720" height="560" rx="24" fill="#fff" filter="url(#sh2)"/>
  <rect x="840" y="185" width="160" height="38" rx="19" fill="#617064"/>
  <text x="920" y="210" fill="#fff" font-family="Inter,sans-serif" font-size="14" font-weight="900" letter-spacing="2" text-anchor="middle">D.CORE 2</text>
  <image href="https://massagechairsandmore.com/cdn/shop/files/asd2.jpg?v=1772565432&amp;width=1200" x="940" y="210" width="480" height="480" preserveAspectRatio="xMidYMid meet"/>

  <!-- D.Core 2 back engine ellipse -->
  <ellipse cx="1150" cy="401" rx="50" ry="75" fill="none" stroke="#617064" stroke-width="2" stroke-dasharray="6 4" opacity=".6"/>
  <circle cx="1110" cy="345" r="8" fill="#617064" opacity=".5"/>
  <circle cx="1150" cy="401" r="8" fill="#617064" opacity=".5"/>
  <circle cx="1195" cy="436" r="8" fill="#617064" opacity=".5"/>
  <!-- SL-Track path -->
  <path d="M1110,345 C1125,365 1140,385 1150,401 C1165,420 1180,430 1195,436" fill="none" stroke="#617064" stroke-width="2" stroke-dasharray="8 4" opacity=".45"/>

  <line x1="1200" y1="401" x2="1310" y2="380" stroke="#617064" stroke-width="1.5"/>
  <rect x="1310" y="360" width="200" height="68" rx="10" fill="#617064" opacity=".08"/>
  <text x="1325" y="382" fill="#617064" font-family="Inter,sans-serif" font-size="12" font-weight="800">3D+ True Shiatsu</text>
  <text x="1325" y="400" fill="#617064" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">10-hand massage robot</text>
  <text x="1325" y="416" fill="#617064" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">Textured silicone heads</text>

  <rect x="840" y="695" width="680" height="18" rx="4" fill="#617064" opacity=".06"/>
  <text x="1180" y="708" fill="#617064" font-family="Inter,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Layered · Refined · Rhythmic · Human-like</text>

  <!-- VS badge -->
  <circle cx="800" cy="450" r="32" fill="#1a1814"/>
  <text x="800" y="456" fill="#e7c77d" font-family="Inter,sans-serif" font-size="16" font-weight="900" text-anchor="middle">VS</text>

  <text x="800" y="940" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">MASSAGECHAIRSANDMORE.COM</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 1600 980" role="img" aria-label="Heat &amp; Programs Diagram — Panasonic MAN1 vs D.Core 2">
  <defs>
    <linearGradient id="bg5" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fbfaf7"/><stop offset="1" stop-color="#eee6da"/></linearGradient>
    <filter id="sh5" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2b2114" flood-opacity=".12"/></filter>
    <linearGradient id="heatA" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8a040" stop-opacity=".25"/><stop offset="1" stop-color="#e8a040" stop-opacity=".05"/></linearGradient>
    <linearGradient id="heatB" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7a8c7e" stop-opacity=".25"/><stop offset="1" stop-color="#7a8c7e" stop-opacity=".05"/></linearGradient>
  </defs>
  <rect width="1600" height="980" fill="url(#bg5)"/>
  
  <text x="800" y="56" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="13" font-weight="900" letter-spacing="4" text-anchor="middle">MASSAGE CHAIRS &amp; MORE — HEAT &amp; PROGRAMS</text>
  <text x="800" y="100" fill="#0b0b0b" font-family="Georgia,serif" font-size="40" font-weight="800" text-anchor="middle">Heat, programs, and comfort</text>
  <text x="800" y="132" fill="#67605a" font-family="Inter,sans-serif" font-size="16" text-anchor="middle">Heated rollers vs triple-region heat — plus auto programs compared</text>

  <!-- MAN1 Card -->
  <rect x="60" y="165" width="720" height="560" rx="24" fill="#fff" filter="url(#sh5)"/>  <image href="https://massagechairsandmore.com/cdn/shop/files/Artboard-1.png?v=1772489014&amp;width=1200" x="180" y="210" width="480" height="480" preserveAspectRatio="xMidYMid meet"/>

  <rect x="80" y="185" width="210" height="38" rx="19" fill="#9a7f4a"/>
  <text x="185" y="210" fill="#fff" font-family="Inter,sans-serif" font-size="14" font-weight="900" letter-spacing="2" text-anchor="middle">PANASONIC MAN1</text>

  <!-- MAN1 Heat zone (back area) -->
  <ellipse cx="379" cy="398" rx="40" ry="55" fill="url(#heatA)" stroke="#e8a040" stroke-width="1.5" stroke-dasharray="5 3" opacity=".7"/>
  <text x="379" y="393" fill="#c8842a" font-family="Inter,sans-serif" font-size="9" font-weight="800" text-anchor="middle">HEAT</text>

  <line x1="419" y1="398" x2="545" y2="360" stroke="#9a7f4a" stroke-width="1.5"/>
  <rect x="545" y="330" width="220" height="100" rx="10" fill="#9a7f4a" opacity=".08"/>
  <text x="560" y="352" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="12" font-weight="800">Infrared Heated Rollers</text>
  <text x="560" y="372" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">Heat delivered through rollers</text>
  <text x="560" y="392" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">12 auto sessions</text>
  <text x="560" y="412" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">10–30 min program length</text>

  <rect x="80" y="695" width="680" height="18" rx="4" fill="#9a7f4a" opacity=".06"/>
  <text x="420" y="708" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Infrared rollers · 12 auto sessions · Touchscreen · Bluetooth · USB</text>

  <!-- D.Core 2 Card -->
  <rect x="820" y="165" width="720" height="560" rx="24" fill="#fff" filter="url(#sh5)"/>  <image href="https://massagechairsandmore.com/cdn/shop/files/asd2.jpg?v=1772565432&amp;width=1200" x="940" y="210" width="480" height="480" preserveAspectRatio="xMidYMid meet"/>

  <rect x="840" y="185" width="160" height="38" rx="19" fill="#617064"/>
  <text x="920" y="210" fill="#fff" font-family="Inter,sans-serif" font-size="14" font-weight="900" letter-spacing="2" text-anchor="middle">D.CORE 2</text>

  <!-- D.Core 2 Heat zones (3 regions) -->
  <ellipse cx="1150" cy="375" rx="35" ry="40" fill="url(#heatB)" stroke="#7a8c7e" stroke-width="1.5" stroke-dasharray="5 3" opacity=".7"/>
  <text x="1150" y="372" fill="#506854" font-family="Inter,sans-serif" font-size="8" font-weight="800" text-anchor="middle">HEAT 1</text>
  <ellipse cx="1195" cy="445" rx="25" ry="20" fill="url(#heatB)" stroke="#7a8c7e" stroke-width="1.5" stroke-dasharray="5 3" opacity=".7"/>
  <text x="1195" y="448" fill="#506854" font-family="Inter,sans-serif" font-size="8" font-weight="800" text-anchor="middle">HEAT 2</text>
  <ellipse cx="1269" cy="498" rx="25" ry="20" fill="url(#heatB)" stroke="#7a8c7e" stroke-width="1.5" stroke-dasharray="5 3" opacity=".7"/>
  <text x="1269" y="501" fill="#506854" font-family="Inter,sans-serif" font-size="8" font-weight="800" text-anchor="middle">HEAT 3</text>

  <line x1="1185" y1="375" x2="1310" y2="340" stroke="#617064" stroke-width="1.5"/>
  <rect x="1310" y="310" width="200" height="100" rx="10" fill="#617064" opacity=".08"/>
  <text x="1325" y="332" fill="#617064" font-family="Inter,sans-serif" font-size="12" font-weight="800">Triple-Region Heat</text>
  <text x="1325" y="352" fill="#617064" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">Back, lumbar, and legs</text>
  <text x="1325" y="372" fill="#617064" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">Zero gravity positioning</text>
  <text x="1325" y="392" fill="#617064" font-family="Inter,sans-serif" font-size="10" font-weight="600" opacity=".8">Bluetooth speakers</text>

  <rect x="840" y="695" width="680" height="18" rx="4" fill="#617064" opacity=".06"/>
  <text x="1180" y="708" fill="#617064" font-family="Inter,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Triple-region heat · Zero gravity · Touchscreen · Bluetooth</text>

  <!-- VS badge -->
  <circle cx="800" cy="450" r="32" fill="#1a1814"/>
  <text x="800" y="456" fill="#e7c77d" font-family="Inter,sans-serif" font-size="16" font-weight="900" text-anchor="middle">VS</text>

  <text x="800" y="940" fill="#9a7f4a" font-family="Inter,sans-serif" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">MASSAGECHAIRSANDMORE.COM</text>
</svg>

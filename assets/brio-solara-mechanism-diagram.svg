  <!-- L-Track zone from Head(374,369) to Lower Back(432,438) -->
  <path d="M374,369 Q390,388 402,407 Q417,423 432,438" fill="none" stroke="#3f5f64" stroke-width="4" stroke-dasharray="8 4" opacity=".7"/>

  <text x="1180" y="708" fill="#a66f3d" font-family="Inter,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Simple Touch Controller · Wireless Charging · Bluetooth® Speakers</text>

  <!-- VS Badge -->
  <circle cx="800" cy="445" r="32" fill="#0b0b0b"/>
  <text x="800" y="453" fill="#fff" font-family="Georgia,serif" font-size="22" font-weight="700" text-anchor="middle">VS</text>


  <text x="1400" y="366" fill="#a66f3d" font-family="Inter,sans-serif" font-size="11" font-weight="800" text-anchor="middle">4-ROLLER ENGINE</text>
  <text x="1400" y="386" fill="#a66f3d" font-family="Inter,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Steady contact glide</text>


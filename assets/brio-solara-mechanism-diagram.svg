  <rect x="1325" y="447" width="155" height="52" rx="8" fill="#a66f3d" opacity=".08"/>
  <text x="1403" y="466" fill="#a66f3d" font-family="Inter,sans-serif" font-size="11" font-weight="800" text-anchor="middle">BACK + CALF HEAT</text>

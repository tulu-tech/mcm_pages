  <text x="640" y="381" fill="#3f5f64" font-family="Inter,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Soft → Firm adjust</text>

  <line x1="432" y1="438" x2="565" y2="460" stroke="#3f5f64" stroke-width="1.5"/>
  <rect x="565" y="447" width="155" height="52" rx="8" fill="#3f5f64" opacity=".08"/>

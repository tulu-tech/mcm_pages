  <rect x="840" y="560" width="140" height="75" rx="10" fill="#a66f3d" opacity=".06"/>
  <text x="910" y="583" fill="#a66f3d" font-family="Inter,sans-serif" font-size="15" font-weight="900" text-anchor="middle">BLUETOOTH</text>
  <text x="910" y="601" fill="#a66f3d" font-family="Inter,sans-serif" font-size="10" font-weight="700" text-anchor="middle">SPEAKERS</text>
  <text x="910" y="621" fill="#a66f3d" font-family="Inter,sans-serif" font-size="10" font-weight="600" text-anchor="middle">+ Wireless Charge</text>

  <rect x="840" y="695" width="680" height="18" rx="4" fill="#a66f3d" opacity=".06"/>
  <text x="1180" y="708" fill="#a66f3d" font-family="Inter,sans-serif" font-size="12" font-weight="700" text-anchor="middle">2 Heat Zones · Bluetooth · Wireless Charging · No Assembly · $2,499</text>

  <!-- VS Badge -->
  <circle cx="800" cy="445" r="32" fill="#0b0b0b"/>

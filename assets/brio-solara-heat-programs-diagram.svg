  <text x="1403" y="498" fill="#e67e22" font-family="Inter,sans-serif" font-size="11" font-weight="800" text-anchor="middle">CALF HEAT</text>
  <text x="1403" y="513" fill="#e67e22" font-family="Inter,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Soothing wrap feel</text>


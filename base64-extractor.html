<!DOCTYPE html>
<html>
<head><title>Base64 Extractor</title></head>
<body>
<h2>Extracting base64...</h2>
<pre id="status">Loading...</pre>
<textarea id="brio_b64" style="width:100%;height:100px"></textarea>
<textarea id="solara_b64" style="width:100%;height:100px"></textarea>
<script>
async function imgToBase64(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = reject;
    img.src = url;
  });
}
(async () => {
  const st = document.getElementById('status');
  st.textContent = 'Loading Brio+...';
  const brio = await imgToBase64('https://cdn.shopify.com/s/files/1/0813/4036/7096/files/Artboard-1-100-14-1.jpg?v=1772325831&width=500');
  document.getElementById('brio_b64').value = brio;
  st.textContent = 'Brio+ done (' + brio.length + ' chars). Loading Solara...';
  
  const solara = await imgToBase64('https://cdn.shopify.com/s/files/1/0813/4036/7096/files/1.jpg?v=1772326021&width=500');
  document.getElementById('solara_b64').value = solara;
  st.textContent = 'Done! Brio+: ' + brio.length + ' chars, Solara: ' + solara.length + ' chars';
  document.title = 'DONE_BRIO=' + brio.length + '_SOLARA=' + solara.length;
  
  // Store for retrieval
  window._brio = brio;
  window._solara = solara;
})();
</script>
</body>
</html>
